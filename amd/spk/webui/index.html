<!doctype html><html><head><meta charset="utf-8"><title>AMD GPU Monitor</title><style>body{font:14px sans-serif;background:#202124;color:#eee;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#303134;border-radius:10px;padding:16px;min-height:112px}.name{color:#b8b8b8}.value{color:#ff4050;font-size:25px;font-weight:bold;margin:7px 0}svg{width:100%;height:42px}polyline{fill:none;stroke:#ff4050;stroke-width:2}</style></head><body><h2>AMD GPU Monitor</h2><div class="grid" id="cards"></div><script>const history=[],samples=[];function val(x,u){return x<0?'Unavailable':x+u}function graph(){const a=Array(50).fill(0),h=history.slice(-50);h.forEach((v,i)=>a[50-h.length+i]=v);return '<svg viewBox="0 0 500 100" preserveAspectRatio="none"><polyline points="'+a.map((v,i)=>i*10+','+(100-v)).join(' ')+'"/></svg>'}function draw(){fetch('./api.cgi').then(r=>r.json()).then(d=>{let gpu=Number(d.gpu_utilization);if(gpu>=0){samples.push(gpu);if(samples.length>10)samples.shift();history.push(gpu);if(history.length>50)history.shift()}let avg=samples.length?Math.round(samples.reduce((a,b)=>a+b,0)/samples.length):-1;let items=[['GPU Utilization',val(avg,'%'),graph()],['Temperature',val(d.temperature_c,' °C'),''],['Fan Speed',val(d.fan_rpm,' RPM'),''],['GPU Clock',val(d.gpu_clock_mhz,' MHz'),''],['Memory Clock',val(d.memory_clock_mhz,' MHz'),''],['Power',val(d.power_w,' W'),'']];document.getElementById('cards').innerHTML=items.map(x=>'<div class="card"><div class="name">'+x[0]+'</div><div class="value">'+x[1]+'</div>'+x[2]+'</div>').join('')})}draw();setInterval(draw,5000)</script></body></html>
