<!doctype html><html><head><meta charset="utf-8"><title>AMD GPU Monitor</title><style>body{font:14px sans-serif;background:#202124;color:#eee;padding:18px}.card{display:inline-block;background:#303134;border-radius:10px;padding:16px;margin:6px;min-width:180px}b{display:block;color:#ff4050;font-size:24px;margin-top:8px}</style></head><body><h2>AMD GPU Monitor</h2><div id="cards"></div><script>function v(x,u){return x<0?'Unavailable':x+u}function draw(){fetch('./api.cgi').then(r=>r.json()).then(d=>{cards.innerHTML=[['GPU Utilization',v(d.gpu_utilization,'%')],['Temperature',v(d.temperature_c,' °C')],['Fan Speed',v(d.fan_rpm,' RPM')],['GPU Clock',v(d.gpu_clock_mhz,' MHz')],['Memory Clock',v(d.memory_clock_mhz,' MHz')],['Power',v(d.power_w,' W')],['VRAM',d.vram_used_mib<0?'Unavailable':d.vram_used_mib+' / '+d.vram_total_mib+' MiB']].map(x=>'<div class="card">'+x[0]+'<b>'+x[1]+'</b></div>').join('')})}draw();setInterval(draw,5000)</script></body></html>
