<!doctype html><html><head><meta charset="utf-8"><title>AMD GPU Monitor</title><style>body{font:14px sans-serif;background:radial-gradient(circle at 85% 5%,#552333 0,#1c233b 38%,#121827 100%);color:#f1f3f6;padding:18px;min-height:100vh}.header{display:flex;align-items:center;gap:12px;margin:0 0 18px}.header img{width:42px;height:42px;border-radius:10px;box-shadow:0 3px 15px #ff3f554d}.header h2{margin:0;font-size:23px;letter-spacing:.2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,#2b344cdd,#20283ddd);border:1px solid #ffffff12;border-radius:12px;padding:16px;min-height:112px;box-shadow:0 8px 20px #0004}.name{color:#bdc5d5}.value{color:#ff5765;font-size:25px;font-weight:bold;margin:7px 0}svg{width:100%;height:42px}polyline{fill:none;stroke:#ff5b68;stroke-width:2}</style></head><body><div class="header"><img src="images/icon_256.png" alt="AMD GPU Monitor"><h2>AMD GPU Monitor</h2></div><div class="grid" id="cards"></div><script>const history=[],samples=[];function val(x,u){return x<0?'Unavailable':x+u}function graph(){const a=Array(50).fill(0),h=history.slice(-50);h.forEach((v,i)=>a[50-h.length+i]=v);return '<svg viewBox="0 0 500 100" preserveAspectRatio="none"><polyline points="'+a.map((v,i)=>i*10+','+(100-v)).join(' ')+'"/></svg>'}function draw(){fetch('./api.cgi').then(r=>r.json()).then(d=>{let gpu=Number(d.gpu_utilization);if(gpu>=0){samples.push(gpu);if(samples.length>10)samples.shift();history.push(gpu);if(history.length>50)history.shift()}let avg=samples.length?Math.round(samples.reduce((a,b)=>a+b,0)/samples.length):-1;let items=[['GPU Utilization',val(avg,'%'),graph()],['Temperature',val(d.temperature_c,' °C'),''],['Fan Speed',val(d.fan_rpm,' RPM'),''],['GPU Clock',val(d.gpu_clock_mhz,' MHz'),''],['Memory Clock',val(d.memory_clock_mhz,' MHz'),''],['Power',val(d.power_w,' W'),'']];document.getElementById('cards').innerHTML=items.map(x=>'<div class="card"><div class="name">'+x[0]+'</div><div class="value">'+x[1]+'</div>'+x[2]+'</div>').join('')})}draw();setInterval(draw,5000)</script></body></html>
